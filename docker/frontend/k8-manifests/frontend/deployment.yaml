apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: banking

  spec:
    replicas: 1
    selector:
      matchlabels:
        app: frontend
    template:
      meatdata:
      labels:
        app: frontend
      spec:
        containers:
          -name: frontend
          image: anju1515/java-banking-frontend:1.0
          ports:
            -containerPort: 8080
          env:
            -name: DB_URL
            value: "jdbc:postgresql://postgres-svc.banking.svc.cluster.local:5432/bnakingdb"
            -name: DB_USERNAME
              valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_USER 
            -name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD  
            -name: JWT_SECRET
              value:"1df0f6fe85156663c1c36121a92b3fc1702bcf52779752d63c25d75915bcd831"
            -name: JWT_EXPIRATION_MS
              value: "86400000"
            -name: CORS_ALLOWED_ORIGIN
              value: "*"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 50
            periodSeconds: 10
            
